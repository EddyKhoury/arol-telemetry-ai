data:
  pools:
    sample:
      - data/sample.csv

  canonical_format: parquet

  parquet_root: data/parquet

  event_parquet_root: data/events

  n_heads: null

  units:
    AppTorque: Nm


processing:
  engine: polars

  lazy: true

analytics:
  torque_expected_min: 1.5
  torque_expected_max: 2.5
  drift_window_seconds: 3600
  idle_window_seconds: 300
  anomaly_sigma: 3.0